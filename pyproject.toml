[project]
name = "rollfast"
version = "1.1.0"
description = "JAX optimization primitives for experimental optimizers and schedulers."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "clementpoiret", email = "clement@linux.com" }
]
keywords = [
    "jax",
    "optax",
    "optimizer",
    "psgd",
    "deep-learning",
    "second-order-optimization",
    "preconditioning"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "jax>=0.6.2",
    "optax>=0.2.8,<0.3.0",
]

[project.optional-dependencies]
equinox = [
    "equinox>=0.13.6",
]

[project.urls]
Homepage = "https://gitlab.com/rhizome-labs/public/rollfast"
Repository = "https://gitlab.com/rhizome-labs/public/rollfast"
Issues = "https://gitlab.com/rhizome-labs/public/rollfast/-/issues"

[build-system]
requires = ["uv_build>=0.9.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "equimo>=2.0.0a2,<3.0.0",
    "equinox>=0.13.6",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    # Keep local checks and fresh CI installs on the same tool versions.
    "ruff==0.16.6",
    "ty==0.0.78",
]

[tool.ruff.lint]
ignore = ["E731", "E741", "F722"]

[tool.ty.src]
include = ["src/rollfast"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that exercise optional third-party integrations",
    "slow: tests that are slower than the focused unit suite",
]
