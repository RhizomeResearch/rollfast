stages:
  - lint
  - test
  - package
  - publish

variables:
  UV_CACHE_DIR: .cache/uv
  MIN_JAX_VERSION: "0.6.2"
  MIN_OPTAX_VERSION: "0.2.8"

default:
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim  # uv pre-installed
  cache:
    key:
      files:
        - pyproject.toml
      prefix: uv
    paths:
      - .cache/uv
  before_script:
    - uv sync --group dev

lint:
  stage: lint
  script:
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run ty check
    - uv run python -c "import tomllib, rollfast; version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']; assert rollfast.__version__ == version, f'rollfast.__version__={rollfast.__version__} != pyproject.toml version={version}'"

minimal-import:
  stage: test
  before_script:
    - uv sync --no-dev
  script:
    - uv run --no-dev python -c "import rollfast"

test:
  stage: test
  script:
    - uv run pytest --junitxml=report.xml
  artifacts:
    reports:
      junit: report.xml

test-minimum:
  stage: test
  before_script:
    - uv sync --no-dev
    - uv pip install "jax==$MIN_JAX_VERSION" "jaxlib==$MIN_JAX_VERSION" "optax==$MIN_OPTAX_VERSION" "equinox==0.13.6" "pytest>=9.0.2"
  script:
    - uv run --no-sync pytest --ignore=tests/test_equimo_integration.py --ignore=tests/integrations --junitxml=report-minimum.xml
  artifacts:
    reports:
      junit: report-minimum.xml

test-multidevice-cpu:
  stage: test
  variables:
    XLA_FLAGS: "--xla_force_host_platform_device_count=4"
  script:
    - uv run python -c "import jax; assert jax.local_device_count() >= 4, jax.devices()"
    - uv run pytest tests/test_multidevice_cpu.py --junitxml=report-multidevice.xml
  artifacts:
    reports:
      junit: report-multidevice.xml

smoke:
  stage: test
  script:
    - uv run python examples/adamw_quickstart.py
    - uv run python examples/schedule_free_eval.py
    - uv run python examples/finetuning/state_memory_report.py
    - uv run python benchmarks/finetuning/memory.py
    - uv run python benchmarks/finetuning/throughput.py
    - uv run python benchmarks/finetuning/convergence.py

package:
  stage: package
  needs:
    - lint
    - minimal-import
    - test
    - test-minimum
    - test-multidevice-cpu
    - smoke
  script:
    - uv build
    - uv venv --clear /tmp/rollfast-wheel-venv
    - uv pip install --python /tmp/rollfast-wheel-venv/bin/python dist/*.whl
    - (cd /tmp && /tmp/rollfast-wheel-venv/bin/python -c "import rollfast")
  artifacts:
    paths:
      - dist/

publish:
  stage: publish
  variables:
    GIT_DEPTH: "0"
  needs:
    - job: lint
    - job: minimal-import
    - job: test
    - job: package
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  environment:
    name: release
    url: https://pypi.org/project/rollfast/
  script:
    - git fetch origin "$CI_DEFAULT_BRANCH"
    - |
      if ! git merge-base --is-ancestor "$CI_COMMIT_SHA" FETCH_HEAD; then
        echo "Error: release commit is not on the default branch ($CI_DEFAULT_BRANCH)"
        exit 1
      fi
    - |
      TAG_VERSION=${CI_COMMIT_TAG#v}
      PROJECT_VERSION=$(grep -m 1 '^version = ' pyproject.toml | awk -F'"' '{print $2}')
      
      echo "Tag version: $TAG_VERSION"
      echo "Project version: $PROJECT_VERSION"
      
      if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
        echo "Error: Tag version ($TAG_VERSION) does not match pyproject.toml version ($PROJECT_VERSION)"
        exit 1
      fi

    - uv publish dist/*
